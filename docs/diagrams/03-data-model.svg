<svg width="700" height="780" viewBox="0 0 700 780" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Fleex 3PL platform — data model entity map</title>
<desc>All planned entities grouped by domain: core tenancy, warehouse structure, inventory and receiving, orders and fulfillment, returns, billing, and integrations and audit.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .t { font-size: 13px; font-weight: 500; }
  .ts { font-size: 11px; fill: #5F5E5A; }
  .grp { font-size: 12px; font-weight: 600; }
  .title { font-size: 16px; font-weight: 600; fill: #2C2C2A; }
  .note { font-size: 10px; fill: #5F5E5A; }
  .rel { stroke: #888780; stroke-width: 1; fill: none; }
  .grpbox { fill: none; stroke-width: 0.5; stroke-dasharray: 3 3; }
  .purple-f { fill: #EEEDFE; stroke: #534AB7; } .purple-t { fill: #26215C; }
  .teal-f { fill: #E1F5EE; stroke: #0F6E56; } .teal-t { fill: #04342C; }
  .blue-f { fill: #E6F1FB; stroke: #185FA5; } .blue-t { fill: #0C447C; }
  .coral-f { fill: #FAECE7; stroke: #993C1D; } .coral-t { fill: #4A1B0C; }
  .pink-f { fill: #FBEAF0; stroke: #993556; } .pink-t { fill: #4B1528; }
  .amber-f { fill: #FAEEDA; stroke: #854F0B; } .amber-t { fill: #412402; }
  .gray-f { fill: #F1EFE8; stroke: #5F5E5A; } .gray-t { fill: #2C2C2A; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="title" x="40" y="26">Fleex 3PL platform — data model entity map</text>
<text class="note" x="40" y="42">Every entity except Company carries companyId (tenant_id) + an RLS policy.</text>
<text class="note" x="40" y="54">Arrows show ownership / one-to-many relationships.</text>

