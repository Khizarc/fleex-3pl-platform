<svg width="700" height="600" viewBox="0 0 700 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Fleex order status state machine</title>
<desc>The validated states an order moves through from draft to delivered, plus side states for hold and cancellation.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .t { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .title { font-size: 16px; font-weight: 600; fill: #2C2C2A; }
  .note { font-size: 11px; fill: #5F5E5A; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
  .gray-f { fill: #F1EFE8; stroke: #5F5E5A; } .gray-t { fill: #2C2C2A; }
  .blue-f { fill: #E6F1FB; stroke: #185FA5; } .blue-t { fill: #0C447C; }
  .teal-f { fill: #E1F5EE; stroke: #0F6E56; } .teal-t { fill: #04342C; }
  .amber-f { fill: #FAEEDA; stroke: #854F0B; } .amber-t { fill: #412402; }
  .red-f { fill: #FCEBEB; stroke: #A32D2D; } .red-t { fill: #501313; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="title" x="40" y="28">Order status — state machine</text>
<text class="note" x="40" y="46">Transitions are validated at the service layer. Direct status writes are never allowed.</text>

<rect class="gray-f" x="240" y="60" width="220" height="44" rx="8" stroke-width="0.5"/>
<text class="t gray-t" x="350" y="86" text-anchor="middle">draft &#8594; submitted</text>

<rect class="blue-f" x="240" y="144" width="220" height="44" rx="8" stroke-width="0.5"/>
<text class="t blue-t" x="350" y="170" text-anchor="middle">ready_to_pick</text>

<rect class="blue-f" x="240" y="228" width="220" height="44" rx="8" stroke-width="0.5"/>
<text class="t blue-t" x="350" y="254" text-anchor="middle">picking &#8594; picked</text>

<rect class="blue-f" x="240" y="312" width="220" height="44" rx="8" stroke-width="0.5"/>
<text class="t blue-t" x="350" y="338" text-anchor="middle">packing &#8594; packed</text>

<rect class="blue-f" x="240" y="396" width="220" height="44" rx="8" stroke-width="0.5"/>
<text class="t blue-t" x="350" y="422" text-anchor="middle">ready_to_ship &#8594; shipped</text>

<rect class="teal-f" x="240" y="480" width="220" height="44" rx="8" stroke-width="0.5"/>
<text class="t teal-t" x="350" y="506" text-anchor="middle">in_transit &#8594; delivered</text>

<rect class="amber-f" x="510" y="228" width="150" height="44" rx="8" stroke-width="0.5"/>
<text class="t amber-t" x="585" y="254" text-anchor="middle">on_hold</text>

<rect class="red-f" x="510" y="312" width="150" height="44" rx="8" stroke-width="0.5"/>
<text class="t red-t" x="585" y="338" text-anchor="middle">cancelled</text>

<line x1="350" y1="104" x2="350" y2="140" class="arr" marker-end="url(#arrow)"/>
<line x1="350" y1="188" x2="350" y2="224" class="arr" marker-end="url(#arrow)"/>
<line x1="350" y1="272" x2="350" y2="308" class="arr" marker-end="url(#arrow)"/>
<line x1="350" y1="356" x2="350" y2="392" class="arr" marker-end="url(#arrow)"/>
<line x1="350" y1="440" x2="350" y2="476" class="arr" marker-end="url(#arrow)"/>

<path d="M460 166 L585 166 L585 224" class="arr" stroke="#BA7517" marker-end="url(#arrowA)"/>
<path d="M585 272 L585 290 L460 290" class="arr" stroke="#BA7517" stroke-dasharray="4 3" marker-end="url(#arrowA)"/>
<path d="M460 334 L506 334" class="arr" stroke="#A32D2D" marker-end="url(#arrowR)"/>

<text class="note" x="510" y="385">Side states</text>
<text class="note" x="510" y="402">Solid amber = enter on_hold</text>
<text class="note" x="510" y="418">Dashed amber = resume</text>
<text class="note" x="510" y="434">Red = cancel (from early states)</text>

<text class="note" x="40" y="556">For each transition, document WHO can trigger it (which role / client) and WHAT side effects fire.</text>
<text class="note" x="40" y="574">Example: shipped &#8594; triggers a tracking notification to the client AND writes a BillableEvent to the ledger.</text>
</svg>
