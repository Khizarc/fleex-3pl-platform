<svg width="700" height="490" viewBox="0 0 700 490" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Fleex 3PL platform — system overview</title>
<desc>Two actors (3PL staff and clients) access two front-end apps that share one backend, which connects to a tenant-isolated database and external integrations.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .t { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; }
  .title { font-size: 16px; font-weight: 600; fill: #2C2C2A; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
  .gray-f { fill: #F1EFE8; stroke: #5F5E5A; } .gray-t { fill: #2C2C2A; } .gray-ts { fill: #5F5E5A; }
  .blue-f { fill: #E6F1FB; stroke: #185FA5; } .blue-t { fill: #0C447C; } .blue-ts { fill: #185FA5; }
  .purple-f { fill: #EEEDFE; stroke: #534AB7; } .purple-t { fill: #26215C; } .purple-ts { fill: #534AB7; }
  .teal-f { fill: #E1F5EE; stroke: #0F6E56; } .teal-t { fill: #04342C; } .teal-ts { fill: #0F6E56; }
  .amber-f { fill: #FAEEDA; stroke: #854F0B; } .amber-t { fill: #412402; } .amber-ts { fill: #854F0B; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="title" x="40" y="28">Fleex 3PL platform — system overview</text>

<rect class="gray-f" x="70" y="55" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="t gray-t" x="170" y="79" text-anchor="middle">3PL warehouse staff</text>
<text class="ts gray-ts" x="170" y="97" text-anchor="middle">Receive, pick, pack, ship</text>

<rect class="gray-f" x="430" y="55" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="t gray-t" x="530" y="79" text-anchor="middle">Client (3PL customer)</text>
<text class="ts gray-ts" x="530" y="97" text-anchor="middle">Orders, inventory, tracking</text>

<rect class="blue-f" x="70" y="165" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="t blue-t" x="170" y="189" text-anchor="middle">Warehouse Dashboard</text>
<text class="ts blue-ts" x="170" y="207" text-anchor="middle">Staff-facing app</text>

<rect class="blue-f" x="430" y="165" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="t blue-t" x="530" y="189" text-anchor="middle">Client Portal</text>
<text class="ts blue-ts" x="530" y="207" text-anchor="middle">Branded, client-facing app</text>

<rect class="purple-f" x="200" y="277" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="t purple-t" x="350" y="301" text-anchor="middle">Shared backend</text>
<text class="ts purple-ts" x="350" y="319" text-anchor="middle">Business logic, workflow + state engine</text>

<rect class="teal-f" x="70" y="389" width="240" height="56" rx="8" stroke-width="0.5"/>
<text class="t teal-t" x="190" y="413" text-anchor="middle">PostgreSQL database</text>
<text class="ts teal-ts" x="190" y="431" text-anchor="middle">Tenant-isolated, RLS enforced</text>

<rect class="amber-f" x="390" y="389" width="240" height="56" rx="8" stroke-width="0.5"/>
<text class="t amber-t" x="510" y="413" text-anchor="middle">External integrations</text>
<text class="ts amber-ts" x="510" y="431" text-anchor="middle">Marketplaces, carriers, payments</text>

<line x1="170" y1="111" x2="170" y2="161" class="arr" marker-end="url(#arrow)"/>
<line x1="530" y1="111" x2="530" y2="161" class="arr" marker-end="url(#arrow)"/>
<path d="M170 221 L170 255 L310 255 L310 273" class="arr" marker-end="url(#arrow)"/>
<path d="M530 221 L530 255 L390 255 L390 273" class="arr" marker-end="url(#arrow)"/>
<path d="M310 333 L310 361 L190 361 L190 385" class="arr" marker-end="url(#arrow)"/>
<path d="M390 333 L390 361 L510 361 L510 385" class="arr" marker-end="url(#arrow)"/>
</svg>
